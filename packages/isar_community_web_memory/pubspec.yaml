name: isar_community_web_memory
description: In-memory (RAM only, non-persistent) implementation of the Isar database, ideal for the web and tests.
version: 3.4.1
repository: https://github.com/isar-community/isar-community
homepage: https://github.com/isar-community/isar-community
issue_tracker: https://github.com/isar-community/isar-community/issues
documentation: https://isar-community.dev

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  isar_community: ^3.4.1
  meta: ^1.7.0

dev_dependencies:
  build_runner: any
  isar_community_generator:
    path: ../isar_community_generator
  test: any
  very_good_analysis: ^3.0.1

dependency_overrides:
  isar_community:
    path: ../isar_community
